<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A penguin at Mahad's terminal</title>
  <desc id="description">An original Linux-inspired penguin, drawn in charcoal, warm cream, and golden yellow, sitting behind a small aubergine terminal. A loose orange orbit and a mint cursor complete the Linux Lab mark. This is an original illustration, not the official Tux artwork.</desc>
  <defs>
