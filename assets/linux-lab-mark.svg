    <ellipse cx="200" cy="113" rx="6.5" ry="12" fill="#221929"/>
    <circle cx="162" cy="109" r="2" fill="#FFF4E9"/>
    <circle cx="202" cy="109" r="2" fill="#FFF4E9"/>
