    <linearGradient id="coat" x1="118" y1="58" x2="240" y2="278" gradientUnits="userSpaceOnUse"><stop stop-color="#302736"/><stop offset="1" stop-color="#17121D"/></linearGradient>
    <linearGradient id="belly" x1="157" y1="155" x2="218" y2="261" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF4E9"/><stop offset="1" stop-color="#E3CEB8"/></linearGradient>
  </defs>
  <circle cx="180" cy="183" r="175" fill="url(#glow)"/>
  <ellipse cx="180" cy="183" rx="146" ry="127" transform="rotate(-21 180 183)" stroke="#F27A48" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 10"/>
  <path d="m55 119 8-9m-10 2 12 5m233 93 10 5m-8-10 4 15" stroke="#F27A48" stroke-width="2" stroke-linecap="round"/>
  <circle cx="281" cy="90" r="4" fill="#A9C9B4"/>
  <g id="penguin">
