  <text x="154" y="31" fill="#9DA3AB" font-family="DejaVu Sans, sans-serif" font-size="13">first commands</text>
  <text x="770" y="31" text-anchor="end" fill="#9DA3AB" font-family="DejaVu Sans Mono, monospace" font-size="13">bash · Linux_LAB</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="26">
<text x="30" y="91" fill="#569CD6">$</text>
<text x="61.31" y="91" xml:space="preserve"><tspan fill="#DCDCAA">bash</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#D4D4D4">hello.sh</tspan></text>
<text x="30" y="128" fill="#B5CEA8">Hello From Bash</text>
<text x="30" y="165" fill="#569CD6">$</text>
<text x="61.31" y="165" xml:space="preserve"><tspan fill="#DCDCAA">echo</tspan><tspan fill="#569CD6"> $((</tspan><tspan fill="#B5CEA8">17</tspan><tspan fill="#D4D4D4"> % </tspan><tspan fill="#B5CEA8">5</tspan><tspan fill="#569CD6">))</tspan></text>
<text x="30" y="202" fill="#B5CEA8">2</text>
<text x="30" y="239" fill="#569CD6">$</text>
<text x="61.31" y="239" xml:space="preserve"><tspan fill="#569CD6">(( </tspan><tspan fill="#B5CEA8">20</tspan><tspan fill="#D4D4D4"> &gt; </tspan><tspan fill="#B5CEA8">15</tspan><tspan fill="#569CD6"> )); </tspan><tspan fill="#DCDCAA">echo</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#CE9178">&quot;$?&quot;</tspan></text>
<text x="30" y="276" fill="#B5CEA8">0</text>
