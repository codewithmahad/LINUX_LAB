  <title id="title">Same terminal. Your turn.</title>
  <desc id="description">A personal invitation to learn Linux with Mahad at UBIT, Karachi. Warm cream lettering on aubergine, an orange terminal prompt, and an original penguin seated at a terminal on the right.</desc>
