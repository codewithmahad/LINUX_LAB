<title id="title">Ask a question. Keep the answer.</title>
<desc id="description">An excerpt from input.sh: read prompts Enter your name, stores Shaikh Mahad in name, and printf prints Name: Shaikh Mahad. The course prompt and summary heading are omitted. Original Bash logo by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="640" height="474" rx="18" fill="#281A30"/>
<text x="28" y="35" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 03</text>
<text x="28" y="88" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#F8F2E9">Ask a question.</text>
<text x="28" y="132" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#FFBE91">Keep the answer.</text>
<image x="521" y="34" width="106" height="106" href="data:image/svg+xml;base64,"/>
<text x="32" y="180" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#CBBAD3">read / from the terminal</text>
<text x="32" y="228" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="25" font-weight="400" fill="#F8F2E9">Enter your name:</text>
<text x="32" y="266" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="29" font-weight="400" fill="#B8D19E">Shaikh Mahad</text>
<path d="M47 283 v40 l-5 -5 m5 5 l5 -5" fill="none" stroke="#B8D19E" stroke-width="2" stroke-linecap="round"/>
<rect x="74" y="288" width="96" height="36" rx="7" fill="#45304B"/>
<text x="89" y="313" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">name</text>
<text x="190" y="312" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#CBBAD3">one complete line</text>
<text x="32" y="363" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#CBBAD3">printf / to the terminal</text>
<rect x="32" y="382" width="576" height="63" rx="10" fill="#1E1E1E" stroke="#4A404B"/>
<text x="52" y="423" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#F8F2E9">Name: Shaikh Mahad</text>
