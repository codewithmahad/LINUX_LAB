<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description">
<title id="title">A few commands. My first script. Shell and Script Basics.</title>
<desc id="description">hello.sh contains a Bash shebang, a blank line, and echo &quot;Hello From Bash&quot;. Running bash hello.sh prints Hello From Bash. The original Bash logo is by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="1120" height="340" rx="18" fill="#281A30"/>
<text x="40" y="47" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 01</text>
<text x="40" y="112" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#F8F2E9">A few commands.</text>
<text x="40" y="167" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#FFBE91">My first script.</text>
<text x="41" y="207" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBBAD3">Write it. Check it. Run it again.</text>
<image x="42" y="230" width="85" height="85" href="data:image/svg+xml;base64,"/>
<text x="145" y="265" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#F8F2E9">SHAIKH MAHAD</text>
<text x="145" y="293" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#CBBAD3">From the terminal to a file I can keep.</text>
<text x="570" y="45" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#D1C2D6">hello.sh / saved commands</text>
<rect x="570" y="61" width="510" height="112" rx="10" fill="#34253B" stroke="#614469"/>
<text x="590" y="97" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#B8D19E">#!/usr/bin/env bash</text>
<text x="590" y="146" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">echo &quot;Hello From Bash&quot;</text>
<path d="M597 180 v16 l-5 -5 m5 5 l5 -5" fill="none" stroke="#BDDAA7" stroke-width="2" stroke-linecap="round"/>
<rect x="570" y="205" width="510" height="108" rx="10" fill="#1E1E1E"/>
<text x="590" y="243" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#B8D19E">$</text>
<text x="621" y="243" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#E3D99C">bash hello.sh</text>
<text x="590" y="288" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#E9E1ED">Hello From Bash</text>
</svg>
