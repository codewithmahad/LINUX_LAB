<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description">
<title id="title">A value to use. A status to check.</title>
<desc id="description">$((17 / 5)) produces integer value 3. The command ((17 &gt; 5)) succeeds and leaves exit status 0 in $?, which echo can print. The value and the exit status are different results. Original Bash logo by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="1120" height="340" rx="18" fill="#281A30"/>
<text x="40" y="47" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 04</text>
<text x="40" y="112" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#F8F2E9">A value to use.</text>
<text x="40" y="167" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#FFBE91">A status to check.</text>
<text x="41" y="207" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBBAD3">Familiar operators. A Bash detail to keep.</text>
<image x="42" y="230" width="85" height="85" href="data:image/svg+xml;base64,"/>
<text x="145" y="265" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#F8F2E9">SHAIKH MAHAD</text>
<text x="145" y="293" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#CBBAD3">Zero can mean the command succeeded.</text>
<text x="570" y="45" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBBAD3">CALCULATED VALUE</text>
<text x="570" y="93" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#FFD0AF">$((17 / 5))</text>
<text x="1005" y="98" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="58" font-weight="500" fill="#FFD0AF">3</text>
<text x="570" y="131" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#CBBAD3">Integer division keeps the whole part.</text>
<path d="M570 166 h510" stroke="#604366" stroke-width="1"/>
<text x="570" y="203" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBBAD3">COMMAND EXIT STATUS</text>
<text x="570" y="251" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#B8D19E">((17 &gt; 5))</text>
<text x="1005" y="256" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="58" font-weight="500" fill="#B8D19E">0</text>
<text x="570" y="294" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#F8F2E9">echo &quot;$?&quot; shows 0: success.</text>
</svg>
