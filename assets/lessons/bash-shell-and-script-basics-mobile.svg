<svg xmlns="http://www.w3.org/2000/svg" width="640" height="464" viewBox="0 0 640 464" role="img" aria-labelledby="title description">
<title id="title">A few commands. My first script. Shell and Script Basics.</title>
<desc id="description">hello.sh contains a Bash shebang, a blank line, and echo &quot;Hello From Bash&quot;. Running bash hello.sh prints Hello From Bash. The original Bash logo is by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="640" height="464" rx="18" fill="#281A30"/>
<text x="28" y="35" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 01</text>
<text x="28" y="88" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#F8F2E9">A few commands.</text>
<text x="28" y="132" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#FFBE91">My first script.</text>
<image x="521" y="34" width="106" height="106" href="data:image/svg+xml;base64,"/>
<text x="32" y="174" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#D1C2D6">hello.sh / saved commands</text>
<rect x="32" y="190" width="576" height="112" rx="10" fill="#34253B" stroke="#614469"/>
<text x="52" y="226" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="21" font-weight="400" fill="#B8D19E">#!/usr/bin/env bash</text>
<text x="52" y="275" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">echo &quot;Hello From Bash&quot;</text>
<path d="M59 309 v16 l-5 -5 m5 5 l5 -5" fill="none" stroke="#BDDAA7" stroke-width="2" stroke-linecap="round"/>
<rect x="32" y="334" width="576" height="108" rx="10" fill="#1E1E1E"/>
<text x="52" y="372" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#B8D19E">$</text>
<text x="83" y="372" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#E3D99C">bash hello.sh</text>
<text x="52" y="417" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#E9E1ED">Hello From Bash</text>
