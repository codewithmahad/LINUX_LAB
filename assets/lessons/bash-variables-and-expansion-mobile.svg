<svg xmlns="http://www.w3.org/2000/svg" width="640" height="474" viewBox="0 0 640 474" role="img" aria-labelledby="title description">
<title id="title">Same name. Different quotes.</title>
<desc id="description">With name=&quot;Shaikh Mahad&quot;, echo &quot;Hello, $name&quot; prints Hello, Shaikh Mahad. echo &#x27;Hello, $name&#x27; prints Hello, $name literally, matching quoting.sh. Original Bash logo by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="640" height="474" rx="18" fill="#281A30"/>
<text x="28" y="35" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 02</text>
<text x="28" y="88" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#F8F2E9">Same name.</text>
<text x="28" y="132" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="37" font-weight="600" fill="#FFBE91">Different quotes.</text>
<image x="521" y="34" width="106" height="106" href="data:image/svg+xml;base64,"/>
<text x="32" y="180" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="22" font-weight="400" fill="#CBBAD3">name=&quot;Shaikh Mahad&quot;</text>
<rect x="32" y="200" width="576" height="103" rx="10" fill="#34253B"/>
<text x="52" y="235" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">echo &quot;Hello, $name&quot;</text>
<text x="52" y="279" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#F8F2E9">Hello, Shaikh Mahad</text>
<text x="52" y="329" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#B8D19E">expand the name</text>
<rect x="32" y="348" width="576" height="103" rx="10" fill="#34253B"/>
<text x="52" y="383" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">echo &#x27;Hello, $name&#x27;</text>
<text x="52" y="427" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#F8F2E9">Hello, $name</text>
<text x="444" y="427" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#B8D19E">keep it literal</text>
</svg>
