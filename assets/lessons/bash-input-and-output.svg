<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title description">
<title id="title">Ask a question. Keep the answer.</title>
<desc id="description">An excerpt from input.sh: read prompts Enter your name, stores Shaikh Mahad in name, and printf prints Name: Shaikh Mahad. The course prompt and summary heading are omitted. Original Bash logo by Prospect One, copyright 2016 Free Software Foundation, under the Free Art License 1.3.</desc>
<rect x="0" y="0" width="1120" height="340" rx="18" fill="#281A30"/>
<text x="40" y="47" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#CBBAD3">LINUX_LAB / BASH 03</text>
<text x="40" y="112" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#F8F2E9">Ask a question.</text>
<text x="40" y="167" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="600" fill="#FFBE91">Keep the answer.</text>
<text x="41" y="207" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBBAD3">One prompt. One line. A useful reply.</text>
<image x="42" y="230" width="85" height="85" href="data:image/svg+xml;base64,"/>
<text x="145" y="265" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#F8F2E9">SHAIKH MAHAD</text>
<text x="145" y="293" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#CBBAD3">My script can ask for the values now.</text>
<text x="570" y="45" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#CBBAD3">read / from the terminal</text>
<text x="570" y="93" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="25" font-weight="400" fill="#F8F2E9">Enter your name:</text>
<text x="570" y="131" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="29" font-weight="400" fill="#B8D19E">Shaikh Mahad</text>
<path d="M585 148 v40 l-5 -5 m5 5 l5 -5" fill="none" stroke="#B8D19E" stroke-width="2" stroke-linecap="round"/>
<rect x="612" y="153" width="96" height="36" rx="7" fill="#45304B"/>
<text x="627" y="178" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="23" font-weight="400" fill="#FFD0AF">name</text>
<text x="728" y="177" font-family="Ubuntu, DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#CBBAD3">one complete line</text>
<text x="570" y="228" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="19" font-weight="400" fill="#CBBAD3">printf / to the terminal</text>
<rect x="570" y="247" width="510" height="63" rx="10" fill="#1E1E1E" stroke="#4A404B"/>
<text x="590" y="288" font-family="Ubuntu Mono, DejaVu Sans Mono, monospace" font-size="27" font-weight="400" fill="#F8F2E9">Name: Shaikh Mahad</text>
</svg>
